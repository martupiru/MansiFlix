# This rule is not used by the project video-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over video.mansiflix.local.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: video-operator
    app.kubernetes.io/managed-by: kustomize
  name: videoencoding-admin-role
rules:
- apiGroups:
  - video.mansiflix.local
  resources:
  - videoencodings
  verbs:
  - '*'
- apiGroups:
  - video.mansiflix.local
  resources:
  - videoencodings/status
  verbs:
  - get
