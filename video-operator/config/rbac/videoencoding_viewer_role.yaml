# This rule is not used by the project video-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to video.mansiflix.local resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: video-operator
    app.kubernetes.io/managed-by: kustomize
  name: videoencoding-viewer-role
rules:
- apiGroups:
  - video.mansiflix.local
  resources:
  - videoencodings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - video.mansiflix.local
  resources:
  - videoencodings/status
  verbs:
  - get
