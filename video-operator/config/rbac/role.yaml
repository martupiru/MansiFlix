---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - video.mansiflix.local
  resources:
  - videoencodings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - video.mansiflix.local
  resources:
  - videoencodings/finalizers
  verbs:
  - update
- apiGroups:
  - video.mansiflix.local
  resources:
  - videoencodings/status
  verbs:
  - get
  - patch
  - update
