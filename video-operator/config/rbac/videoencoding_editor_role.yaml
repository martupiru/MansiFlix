# This rule is not used by the project video-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the video.mansiflix.local.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: video-operator
    app.kubernetes.io/managed-by: kustomize
  name: videoencoding-editor-role
rules:
- apiGroups:
  - video.mansiflix.local
  resources:
  - videoencodings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - video.mansiflix.local
  resources:
  - videoencodings/status
  verbs:
  - get
