apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/part-of: mansiflix
  policyTypes: [Ingress]
  ingress:
    - from:
        # podSelector alone restricts this peer to the SAME namespace.
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: mansiflix
              mansiflix.local/minio-access: "true"
      ports:
        - protocol: TCP
          port: 9000
