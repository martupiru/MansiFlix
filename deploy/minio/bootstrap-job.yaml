apiVersion: batch/v1
kind: Job
metadata:
  generateName: mansiflix-minio-bootstrap-
  namespace: mansiflix
  labels:
    app.kubernetes.io/part-of: mansiflix
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: mansiflix
        app.kubernetes.io/component: minio-bootstrap
        mansiflix.local/minio-access: "true"
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: mansiflix/minio-mc:source-7394ce0dd2a8-amd64-r2
          imagePullPolicy: Never
          command: [/bin/sh, /opt/minio/bootstrap.sh]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: mansiflix-minio-admin
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mansiflix-minio-admin
                  key: MINIO_ROOT_PASSWORD
            - name: WORKER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mansiflix-minio-worker
                  key: access-key
            - name: WORKER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mansiflix-minio-worker
                  key: secret-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tools
              mountPath: /opt/minio
              readOnly: true
            - name: temp
              mountPath: /tmp
      volumes:
        - name: tools
          configMap:
            name: mansiflix-minio-tools
            defaultMode: 0444
        - name: temp
          emptyDir:
            sizeLimit: 64Mi
