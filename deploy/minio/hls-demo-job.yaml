# Separate synthetic demo Job; never mounts a PVC.
apiVersion: "batch/v1"
kind: "Job"
metadata:
  generateName: "mansiflix-minio-hls-"
  namespace: "mansiflix"
  labels:
    app.kubernetes.io/part-of: "mansiflix"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: "mansiflix"
        app.kubernetes.io/component: "minio-hls-demo"
        mansiflix.local/minio-access: "true"
    spec:
      automountServiceAccountToken: false
      restartPolicy: "Never"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      initContainers:
        -
          name: "download"
          image: "mansiflix/minio-mc:source-7394ce0dd2a8-amd64-r2"
          imagePullPolicy: "Never"
          command:
            - "/bin/sh"
            - "/opt/minio/worker-transfer.sh"
            - "download"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            -
              name: "work"
              mountPath: "/work"
            -
              name: "temp"
              mountPath: "/tmp"
            -
              name: "tools"
              mountPath: "/opt/minio"
              readOnly: true
          env:
            -
              name: "WORKER_ACCESS_KEY"
              valueFrom:
                secretKeyRef:
                  name: "mansiflix-minio-worker"
                  key: "access-key"
            -
              name: "WORKER_SECRET_KEY"
              valueFrom:
                secretKeyRef:
                  name: "mansiflix-minio-worker"
                  key: "secret-key"
            -
              name: "POD_UID"
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.uid"
        -
          name: "encode"
          image: "mansiflix/video-worker:demo-88bb1d91e247"
          imagePullPolicy: "Never"
          command:
            - "video-worker"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            -
              name: "work"
              mountPath: "/work"
            -
              name: "temp"
              mountPath: "/tmp"
            -
              name: "tools"
              mountPath: "/opt/minio"
              readOnly: true
          env:
            -
              name: "SOURCE"
              value: "/work/input.mp4"
            -
              name: "RESOLUTION"
              value: "360"
            -
              name: "OUTPUT"
              value: "/work/hls"
      containers:
        -
          name: "upload"
          image: "mansiflix/minio-mc:source-7394ce0dd2a8-amd64-r2"
          imagePullPolicy: "Never"
          command:
            - "/bin/sh"
            - "/opt/minio/worker-transfer.sh"
            - "upload"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            -
              name: "work"
              mountPath: "/work"
            -
              name: "temp"
              mountPath: "/tmp"
            -
              name: "tools"
              mountPath: "/opt/minio"
              readOnly: true
          env:
            -
              name: "WORKER_ACCESS_KEY"
              valueFrom:
                secretKeyRef:
                  name: "mansiflix-minio-worker"
                  key: "access-key"
            -
              name: "WORKER_SECRET_KEY"
              valueFrom:
                secretKeyRef:
                  name: "mansiflix-minio-worker"
                  key: "secret-key"
            -
              name: "POD_UID"
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.uid"
      volumes:
        -
          name: "tools"
          configMap:
            name: "mansiflix-minio-tools"
            defaultMode: 292
        -
          name: "work"
          emptyDir:
            sizeLimit: "256Mi"
        -
          name: "temp"
          emptyDir:
            sizeLimit: "64Mi"
