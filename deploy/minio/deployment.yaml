apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: mansiflix
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/part-of: mansiflix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: mansiflix
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          # Custom source build verified/imported for the synthetic academic demo.
          image: mansiflix/minio:source-9e49d5e7a648-amd64-r1
          imagePullPolicy: Never
          command: [/bin/sh, -ec]
          args:
            - |
              set +x
              : "${MINIO_ROOT_USER:?MINIO_ROOT_USER must come from its Secret}"
              : "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must come from its Secret}"
              [ "${#MINIO_ROOT_USER}" -ge 3 ] || { printf 'FAIL: invalid root identity length\n' >&2; exit 1; }
              [ "${#MINIO_ROOT_PASSWORD}" -ge 32 ] || { printf 'FAIL: root password must contain at least 32 characters\n' >&2; exit 1; }
              exec /usr/local/bin/minio --quiet --certs-dir /tmp/certs \
                server /data --address :9000 --console-address 127.0.0.1:9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: mansiflix-minio-admin
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mansiflix-minio-admin
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BROWSER
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/cluster
              port: s3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mansiflix-minio-data
        - name: temp
          emptyDir:
            sizeLimit: 128Mi
