# Separate synthetic demo Job; never mounts a PVC.
apiVersion: "batch/v1"
kind: "Job"
metadata:
  generateName: "mansiflix-minio-seed-"
  namespace: "mansiflix"
  labels:
    app.kubernetes.io/part-of: "mansiflix"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: "mansiflix"
        app.kubernetes.io/component: "minio-synthetic-seed"
        mansiflix.local/minio-access: "true"
    spec:
      automountServiceAccountToken: false
      restartPolicy: "Never"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      initContainers:
        -
          name: "generate"
          image: "mansiflix/video-worker:demo-88bb1d91e247"
          imagePullPolicy: "Never"
          command:
            - "ffmpeg"
            - "-nostdin"
            - "-y"
            - "-f"
            - "lavfi"
            - "-i"
            - "testsrc2=size=320x180:rate=24"
            - "-f"
            - "lavfi"
            - "-i"
            - "sine=frequency=440:sample_rate=44100"
            - "-t"
            - "8"
            - "-c:v"
            - "libx264"
            - "-preset"
            - "ultrafast"
            - "-c:a"
            - "aac"
            - "-movflags"
            - "+faststart"
            - "/work/synthetic.mp4"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            -
              name: "work"
              mountPath: "/work"
            -
              name: "temp"
              mountPath: "/tmp"
            -
              name: "tools"
              mountPath: "/opt/minio"
              readOnly: true
      containers:
        -
          name: "seed"
          image: "mansiflix/minio-mc:source-7394ce0dd2a8-amd64-r2"
          imagePullPolicy: "Never"
          command:
            - "/bin/sh"
            - "/opt/minio/seed-demo.sh"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            -
              name: "work"
              mountPath: "/work"
            -
              name: "temp"
              mountPath: "/tmp"
            -
              name: "tools"
              mountPath: "/opt/minio"
              readOnly: true
          env:
            -
              name: "MINIO_ROOT_USER"
              valueFrom:
                secretKeyRef:
                  name: "mansiflix-minio-admin"
                  key: "MINIO_ROOT_USER"
            -
              name: "MINIO_ROOT_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "mansiflix-minio-admin"
                  key: "MINIO_ROOT_PASSWORD"
            -
              name: "WORKER_ACCESS_KEY"
              valueFrom:
                secretKeyRef:
                  name: "mansiflix-minio-worker"
                  key: "access-key"
            -
              name: "WORKER_SECRET_KEY"
              valueFrom:
                secretKeyRef:
                  name: "mansiflix-minio-worker"
                  key: "secret-key"
      volumes:
        -
          name: "tools"
          configMap:
            name: "mansiflix-minio-tools"
            defaultMode: 292
        -
          name: "work"
          emptyDir:
            sizeLimit: "256Mi"
        -
          name: "temp"
          emptyDir:
            sizeLimit: "64Mi"
